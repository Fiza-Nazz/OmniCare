name: OmniCare Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-tests:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.11.12" pytest pytest-asyncio httpx aiosqlite pydantic pydantic-settings sqlalchemy asyncpg
          if [ -f services/api/requirements.txt ]; then pip install -r services/api/requirements.txt; fi

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Verify Secret & PHI Sanitization
        run: |
          python scripts/verify_codebase.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_automated_ci_pipeline_only_32_bytes_long

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Frontend Structure
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web
            npm ci
            npm run lint
            npm run build
          else
            echo "No frontend package.json found yet; skipping frontend build."
          fi
