name: OmniCare Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-typecheck:
    name: Backend Lint, Security & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx
          if [ -f services/api/requirements.txt ]; then pip install -r services/api/requirements.txt; fi

      - name: Run Ruff Lint (Security & Style)
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Verify Secret Sanitization
        run: |
          python scripts/verify_codebase.py

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    needs: backend-lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnicare_user
          POSTGRES_PASSWORD: omnicare_test_password
          POSTGRES_DB: omnicare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          if [ -f services/api/requirements.txt ]; then pip install -r services/api/requirements.txt; fi

      - name: Run Pytest Suite
        run: |
          pytest -v tests/
        env:
          ENVIRONMENT: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: omnicare_test
          DATABASE_USER: omnicare_user
          DATABASE_PASSWORD: omnicare_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test_secret_key_for_automated_ci_pipeline_only_32_bytes_long

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Frontend Structure
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web
            npm ci
            npm run lint
            npm run build
          fi
